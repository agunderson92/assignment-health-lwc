<template>
    <lightning-card title="Revenue Cap Burndown — Capped Activities" icon-name="utility:money">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Filters -->
            <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-wrap slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-record-picker
                        label="Account"
                        placeholder="Filter by account…"
                        object-api-name="Account"
                        onchange={handleAccountChange}>
                    </lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-record-picker
                        label="Engagement Manager"
                        placeholder="Filter by manager…"
                        object-api-name="User"
                        onchange={handleManagerChange}>
                    </lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
                    <lightning-button label="Clear" onclick={handleClear} variant="neutral"></lightning-button>
                </div>
            </div>

            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Loading capped activities" size="small"></lightning-spinner>
            </template>

            <template lwc:if={hasChart}>
                <div class="slds-m-bottom_medium">
                    <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">% of cap used</p>
                    <div class="chart-scroll">
                        <template for:each={chartData} for:item="b">
                            <div key={b.key} class="chart-row">
                                <span class="chart-label" title={b.title}>{b.label}</span>
                                <div class="chart-track">
                                    <div class={b.barClass} style={b.widthStyle}></div>
                                </div>
                                <span class="chart-value">{b.valueLabel}</span>
                            </div>
                        </template>
                    </div>
                    <div class="chart-legend slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        <span class="legend-swatch bar-green"></span>&le; 50%
                        <span class="legend-swatch bar-yellow"></span>50&ndash;80%
                        <span class="legend-swatch bar-red"></span>&gt; 80%
                    </div>
                </div>
            </template>

            <template lwc:if={hasRows}>
                <lightning-datatable
                    key-field="activityId"
                    columns={columns}
                    data={rows}
                    hide-checkbox-column
                    sorted-by={sortedBy}
                    sorted-direction={sortDirection}
                    onsort={handleSort}
                    onrowaction={handleRowAction}
                    column-widths-mode="auto">
                </lightning-datatable>

                <!-- Pager -->
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small">
                    <lightning-button
                        label="Previous"
                        icon-name="utility:chevronleft"
                        disabled={isFirstPage}
                        onclick={handlePrev}>
                    </lightning-button>
                    <span class="slds-text-body_small slds-text-color_weak">{pageLabel}</span>
                    <lightning-button
                        label="Next"
                        icon-name="utility:chevronright"
                        icon-position="right"
                        disabled={isLastPage}
                        onclick={handleNext}>
                    </lightning-button>
                </div>

                <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                    One row per Resourced Activity with a Usage Cap (not rolled up to the engagement, so element-level
                    over/under-burn isn't netted away). Status is driven by forecast revenue vs the cap. Read-only.
                </p>
            </template>

            <template lwc:if={error}>
                <p class="slds-text-color_error">Unable to load capped activities.</p>
            </template>

            <template lwc:if={showEmpty}>
                <p class="slds-text-body_regular slds-text-color_weak">No active capped activities match these filters.</p>
            </template>
        </div>
    </lightning-card>
</template>
